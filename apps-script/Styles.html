<style>
  :root {
    --bg-main: #f8fafc;
    --bg-card: #ffffff;
    --border: #e2e8f0;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-soft: #eef2ff;
    --success: #16a34a;
    --warning: #d97706;
    --danger: #dc2626;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Plus Jakarta Sans", sans-serif;
    background-color: var(--bg-main);
    color: var(--text-primary);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .tabular-nums {
    font-variant-numeric: tabular-nums;
  }

  .app-layout {
    display: flex;
    min-height: 100vh;
  }

  /* Sidebar */
  .sidebar {
    width: 260px;
    background: #0f172a;
    color: #f8fafc;
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 40;
    border-right: 1px solid #1e293b;
  }

  .sidebar-brand {
    padding: 24px 20px;
    border-bottom: 1px solid #1e293b;
  }

  .sidebar-brand h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sidebar-brand p {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 4px;
  }

  .sidebar-nav {
    padding: 16px 12px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 10px 14px;
    border-radius: 8px;
    background: transparent;
    border: none;
    color: #94a3b8;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s ease;
  }

  .nav-btn:hover {
    background: #1e293b;
    color: #ffffff;
  }

  .nav-btn.active {
    background: #312e81;
    color: #c7d2fe;
    font-weight: 600;
  }

  .sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid #1e293b;
    font-size: 12px;
    color: #64748b;
  }

  /* Main Area */
  .main-content {
    flex: 1;
    margin-left: 260px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    height: 64px;
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    position: sticky;
    top: 0;
    z-index: 30;
  }

  .topbar-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    white-space: nowrap;
    transition: all 0.15s ease;
  }

  .btn-primary {
    background: var(--accent);
    color: #ffffff;
  }

  .btn-primary:hover {
    background: var(--accent-hover);
  }

  .btn-secondary {
    background: #ffffff;
    border-color: var(--border);
    color: var(--text-primary);
  }

  .btn-secondary:hover {
    background: #f1f5f9;
  }

  .btn-danger {
    background: #fef2f2;
    border-color: #fecaca;
    color: var(--danger);
  }

  .btn-danger:hover {
    background: #fee2e2;
  }

  .page-viewport {
    padding: 32px;
    max-width: 1280px;
    width: 100%;
    margin: 0 auto;
  }

  /* KPI Grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  .stat-label {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  .stat-value {
    font-size: 28px;
    font-weight: 700;
    color: var(--text-primary);
    margin-top: 6px;
  }

  /* Hero Highlight Card */
  .next-birthday-hero {
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
    color: #ffffff;
    border-radius: 14px;
    padding: 28px 32px;
    margin-bottom: 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .hero-tag {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #a5b4fc;
    font-weight: 600;
  }

  .hero-name {
    font-size: 26px;
    font-weight: 700;
    margin: 6px 0 4px 0;
  }

  .hero-sub {
    font-size: 14px;
    color: #c7d2fe;
  }

  .hero-countdown {
    text-align: right;
  }

  .hero-days {
    font-size: 42px;
    font-weight: 800;
    line-height: 1;
    color: #ffffff;
  }

  .hero-unit {
    font-size: 12px;
    color: #a5b4fc;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* Today Alert Banner */
  .today-alert {
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #065f46;
  }

  /* Table and Card List */
  .card-container {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  .table th {
    text-align: left;
    padding: 12px 18px;
    background: #f8fafc;
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border);
  }

  .table td {
    padding: 14px 18px;
    border-bottom: 1px solid #f1f5f9;
    color: var(--text-primary);
  }

  .table tr:hover {
    background: #f8fafc;
  }

  /* Modals */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(15, 23, 42, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    backdrop-filter: blur(2px);
  }

  .modal-box {
    background: #ffffff;
    border-radius: 14px;
    width: 100%;
    max-width: 500px;
    padding: 28px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .form-input, .form-select, .form-textarea {
    width: 100%;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 14px;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.15s ease;
  }

  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: var(--accent);
  }

  /* Toast notification */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #0f172a;
    color: #ffffff;
    padding: 14px 20px;
    border-radius: 10px;
    font-size: 14px;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
    z-index: 60;
    display: flex;
    align-items: center;
    gap: 10px;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.25s ease;
  }

  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  /* Empty state */
  .empty-state {
    padding: 48px 24px;
    text-align: center;
    color: var(--text-secondary);
  }

  .empty-state h3 {
    font-size: 16px;
    color: var(--text-primary);
    margin-bottom: 6px;
  }

  /* Mobile responsiveness */
  @media (max-width: 900px) {
    .stats-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 640px) {
    .sidebar {
      display: none;
    }
    .main-content {
      margin-left: 0;
    }
    .stats-grid {
      grid-template-columns: 1fr;
    }
    .next-birthday-hero {
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
    }
    .hero-countdown {
      text-align: left;
    }
    .page-viewport {
      padding: 16px;
    }
  }
</style>
